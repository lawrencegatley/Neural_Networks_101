[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nn101"
version = "0.1.0"
description = "A neural network built from first principles in NumPy, with notebooks explaining each step."
authors = [{ name = "Lawrence Gatley" }]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
